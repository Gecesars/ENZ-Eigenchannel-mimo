observacoes:
  - Os pontos materiais da linha de integração são DERIVADOS de plano_porta_y=-18 mm, espessura_fundo_exploratoria=3 mm e altura_interna_wr28=7,11 mm; foram explicitados porque o AEDT 2024 R2 rejeitou expressões de variáveis nesse campo nativo.
  - Esta versão não substitui g0_artigo_base.auditado.v4.yaml nem o smoke M0.
  - A topologia e as dimensões PUBLICADO vêm das Figuras 1-2 e Seções II-III do artigo.
  - A posição da porta, o comprimento da flange, o passo das ranhuras, os eixos dos pinos e os furos são HIPÓTESE porque não há coordenadas CAD no PDF.
  - O contorno interno 18 mm x 6 mm preserva exatamente 108 mm2, mas seu mapeamento para a Figura 2 é exploratório.
  - FR4_epoxy com epsilon_r=4,4 e tan_delta=0,02 é HIPÓTESE; o artigo não publica propriedades complexas do laminado.
  - PEC substitui o alumínio real porque a liga, a condutividade e a rugosidade do modelo não são publicadas.
  - O setup adaptativo e seus critérios são HIPÓTESE de implementação; o artigo publica HFSS/FEM e as faixas, mas não malha, DeltaS ou número de passes.
  - A v6 corrige a folha WR-28 para 3,56 mm em X por 7,11 mm em Z e fixa a linha de integração do modo em Z.
  - Os relatórios do artigo são configurados no projeto; padrões normalizados exigem normalização explícita no pós-processamento e não substituem dados originais ausentes.
  - As variações dos Modelos III a IX não são reconstruídas porque os respectivos contornos CAD não são publicados; apenas c, wsp e hsp cotados recebem estudos paramétricos.
  - Nenhum resultado desta versão pode ser apresentado como reprodução fiel ou validado contra S11, campo, ganho ou padrão publicados.
