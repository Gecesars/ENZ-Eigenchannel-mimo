observacoes:
  - Esta versão não substitui g0_artigo_base.preliminar.yaml.
  - Valores medidos de ranhura descrevem o protótipo e o modelo com tolerâncias, não a cota nominal da Figura 2.
  - Nenhuma etapa G0 é executável enquanto os bloqueios declarados permanecerem.
