etapas:
  M0:
    estado: documental_bloqueado
    bloqueios: [cavidade_comprimento desconhecido, orientação da Figura 2 não auditada]
    solucao: Eigenmode
    requer: [cavidade_comprimento, cavidade_largura_inicial, cavidade_altura_inicial]
    objetos:
      - nome: Cavity_Air
        tipo: box
        origem: [0, 0, 0]
        tamanho: [cavidade_comprimento, cavidade_largura_inicial, cavidade_altura_inicial]
        material: vacuum
    operacoes: []
    fronteiras:
      - {nome: PEC_Cavity, tipo: perfect_e, alvo: Cavity_Air, selecao: todas_faces}
    portas: []
    setup:
      nome: Setup_Eigen_18_32
      tipo: null
      propriedades: {MinimumFrequency: 18GHz, NumModes: 12, MaxDeltaFreq: 0.1, MaximumPasses: 12, MinimumConvergedPasses: 2}
  M1:
    estado: documental_bloqueado
    bloqueios: [topologia e cotas completas da Figura 2 não transcritas]
    solucao: DrivenModal
    requer: [cavidade_comprimento, espessura_parede, wr28_comprimento, ranhura_comprimento_nominal, ranhura_largura_nominal, ranhuras_posicoes]
    objetos: []
