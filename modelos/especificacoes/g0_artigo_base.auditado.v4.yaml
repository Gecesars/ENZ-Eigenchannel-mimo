    requer: [cavidade_comprimento_interno, cavidade_largura_inicial, cavidade_altura_inicial]
    objetos: []
    operacoes: []
    fronteiras: []
    portas: []
    setup:
      nome: Setup_Eigen_18_32
      tipo: null
      propriedades: {MinimumFrequency: 18GHz, NumModes: 12, MaxDeltaFreq: 0.1, MaximumPasses: 12, MinimumConvergedPasses: 2}
  M1:
    estado: documental_bloqueado
    bloqueios: [comprimento interno e coordenadas CAD das tres ranhuras desconhecidos]
    solucao: DrivenModal
    requer: [cavidade_comprimento_interno, ranhuras_posicoes_cad, wr28_comprimento_e_plano_porta]
    objetos: []
    operacoes: []
    fronteiras: []
    portas: []
    setup: {nome: Setup_Driven_25p87, tipo: null, propriedades: {Frequency: 25.87GHz, MaxDeltaS: 0.02, MaximumPasses: 15, MinimumConvergedPasses: 2}}
  M2:
    estado: documental_bloqueado
    bloqueios: [contorno interno final e coordenadas CAD das cinco ranhuras desconhecidos]
