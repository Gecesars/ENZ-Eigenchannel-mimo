    estado: documental_bloqueado
    bloqueios: [epsilon_r e tan_delta do FR4 desconhecidos, coordenadas dos pinos desconhecidas, liga e condutividade desconhecidas]
    solucao: DrivenModal
    requer: [fr4_epsilon_r, fr4_tan_delta, pinos_posicoes_cad, aluminio_condutividade_simulada]
    objetos: []
    operacoes: []
    fronteiras: []
    portas: []
    setup: {nome: Setup_Driven_25p87, tipo: null, propriedades: {Frequency: 25.87GHz, MaxDeltaS: 0.02, MaximumPasses: 15, MinimumConvergedPasses: 2}}
observacoes:
  - Esta versao nao substitui as versoes v1-v3.
  - A Figura 2(a) foi inspecionada no PDF validado em resolucao de 2448 por 3168 pixels.
  - Cotas externas nao foram promovidas a coordenadas internas de CAD.
  - A ausencia das propriedades complexas do FR4 impede reproduzir matching, eficiencia e ganho.
  - Nenhuma etapa G0 e executavel enquanto os bloqueios declarados permanecerem.
