    requer: [cavidade_largura_final, cavidade_altura_final, ranhuras_posicoes_cad]
    objetos: []
    operacoes: []
    fronteiras: []
    portas: []
    setup: {nome: Setup_Driven_25p87, tipo: null, propriedades: {Frequency: 25.87GHz, MaxDeltaS: 0.02, MaximumPasses: 15, MinimumConvergedPasses: 2}}
  M3:
    estado: documental_bloqueado
    bloqueios: [perfil CAD completo do degrau e contorno interno desconhecidos]
    solucao: DrivenModal
    requer: [cavidade_largura_final, cavidade_altura_final, ranhuras_posicoes_cad, degrau_largura, degrau_altura]
    objetos: []
    operacoes: []
    fronteiras: []
    portas: []
    setup: {nome: Setup_Driven_25p87, tipo: null, propriedades: {Frequency: 25.87GHz, MaxDeltaS: 0.02, MaximumPasses: 15, MinimumConvergedPasses: 2}}
