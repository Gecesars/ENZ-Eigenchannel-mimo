name: Publicar suíte AEDT 2024 R2

on:
  push:
    branches:
      - feat/aedt-2024r2-geometry-validation
    paths:
      - "tools/bootstrap_aedt_payload/**"
      - "tools/bootstrap_aedt_2024r2.py"
      - ".github/workflows/bootstrap_aedt_2024r2.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Obter repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar núcleo e ferramentas de teste
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Reconstruir, validar e publicar implementação
        run: python tools/bootstrap_aedt_2024r2.py
