name: Publicar corpus científico inicial

on:
  push:
    paths:
      - ".github/workflows/bootstrap_corpus.yml"
      - "tools/bootstrap_corpus.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Obter repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extrair, validar e publicar corpus
        run: python tools/bootstrap_corpus.py
