[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enz-eigenchannel-mimo"
version = "0.0.1"
description = "Ferramentas científicas para cavidades ENZ multiporta e autocanais MIMO"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Geraldo César Simão"}]
dependencies = ["numpy>=1.26", "PyYAML>=6.0", "jsonschema>=4.23"]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "mypy>=1.10",
  "types-PyYAML>=6.0",
  "types-jsonschema>=4.23",
  "types-psutil>=7.0",
]
aedt = ["pyaedt==1.3.0", "psutil>=7.0"]
documents = [
  "matplotlib>=3.8",
  "Pillow>=10.0",
  "pymupdf>=1.24",
  "pypdf>=6.0",
  "reportlab>=4.0",
]

[project.scripts]
enz-validar-spec = "enz_eigenchannel_mimo.cli:validar_spec_main"
enz-aedt-worker = "enz_eigenchannel_mimo.cli:aedt_worker_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
enz_eigenchannel_mimo = ["schemas/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["testes"]

[tool.mypy]
python_version = "3.12"

[[tool.mypy.overrides]]
module = ["ansys.*"]
ignore_missing_imports = true
